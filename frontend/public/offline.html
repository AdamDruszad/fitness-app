<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light"><meta name="theme-color" content="#121110"><title>FitAI — Reconnect</title><style>
:root{--bg:#121110;--text:#f4efe9;--muted:#b3aaa1;--accent:#e2673b;--link:#f2956d;--line:rgb(255 236 222/.09)}
@media (prefers-color-scheme:light){:root{--bg:#f6f2eb;--text:#1d1a17;--muted:#5c544d;--accent:#c4512a;--link:#a3401c;--line:rgb(52 36 22/.12)}}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:34rem}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}.bar{width:7px;height:24px;background:var(--accent);transform:skewX(-14deg)}
h1{margin:32px 0 12px;font-size:clamp(34px,8vw,52px);line-height:1;letter-spacing:-.02em}p{color:var(--muted);margin:0 0 24px}
a{display:inline-flex;align-items:center;min-height:44px;color:var(--link);font-weight:600;text-underline-offset:3px}
</style></head><body><main><div class="brand"><span class="bar" aria-hidden="true"></span>FitAI</div><h1>Let's reconnect.</h1><p>Opening FitAI requires a connection. Workouts saved on this device remain available after you reconnect and sign into the same account.</p><p><a href="/">Try opening FitAI again</a></p></main></body></html>
