<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f2eb" media="(prefers-color-scheme: light)">
    <title>FitAI — Reconnect</title>
    <style>
      :root { color-scheme: dark; background: #121110; color: #f4efe9; font: 16px/1.6 system-ui, sans-serif; }
      body { max-width: 34rem; margin: 12svh auto; padding: 24px max(24px, env(safe-area-inset-right)) 24px max(24px, env(safe-area-inset-left)); }
      .brand { font-size: 24px; font-weight: 800; }
      .brand::before { content: ""; display: inline-block; width: 7px; height: 24px; margin-right: 10px; background: #e2673b; transform: skewX(-14deg); vertical-align: middle; }
      h1 { font-size: clamp(32px, 7vw, 48px); line-height: 1.1; letter-spacing: -0.03em; }
      p { color: #b3aaa1; }
      a { display: inline-block; padding-block: 12px; color: #f2956d; font-weight: 600; text-underline-offset: 4px; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
      @media (prefers-color-scheme: light) { :root { color-scheme: light; background: #f6f2eb; color: #1d1a17; } p { color: #5c544d; } a { color: #a3401c; } }
    </style>
  </head>
  <body>
    <div class="brand">FitAI</div>
    <main>
      <h1>Let's reconnect.</h1>
      <p>Opening FitAI requires a connection. Workouts saved on this device remain available after you reconnect and sign into the same account.</p>
      <p><a href="/">Try opening FitAI again</a></p>
    </main>
  </body>
</html>
